
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR INDIA ENGLISH GROUP</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f4fa;color:#17233b}
header{background:#14213d;color:white;text-align:center;padding:25px}
header h1{margin:0}
header p{color:#cbd7f3}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:14px;margin-bottom:20px;box-shadow:0 4px 15px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
input,textarea,select{width:100%;padding:12px;margin:8px 0 15px;border:1px solid #ccd4e2;border-radius:8px}
button{background:#315efb;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;margin:4px}
.secondary{background:#e7edff;color:#2147c3}
.danger{background:#d93645}
.question{padding:15px;border:1px solid #ddd;border-radius:9px;margin:12px 0}
.hidden{display:none}
small{color:#d5def7}
</style>
</head>
<body>
<header>
<h1>AR INDIA ENGLISH GROUP</h1>
<p>ONLINE EXAMINATION PORTAL</p>
</header>
<main id="app"></main>

<script>
const KEY="ar_india_exam_data";
let data;
try{
 data=JSON.parse(localStorage.getItem(KEY))||{students:[],exams:[],results:[]};
}catch(e){
 data={students:[],exams:[],results:[]};
}
let user=null;

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}
function el(id){return document.getElementById(id)}
function home(){
 user=null;
 el("app").innerHTML=`
 <div class="grid">
 <section class="card">
 <h2>🎓 Student Login</h2>
 <label>Student ID</label><input id="sid" placeholder="Student ID">
 <label>Password</label><input id="sp" type="password" placeholder="Password">
 <button onclick="studentLogin()">Login</button>
 <button class="secondary" onclick="registerPage()">Register</button>
 </section>
 <section class="card">
 <h2>📝 Examiner Login</h2>
 <label>Username</label><input id="eid" value="examiner">
 <label>Password</label><input id="ep" type="password" placeholder="Password">
 <button onclick="examinerLogin()">Login as Examiner</button>
 <p><small>Demo password: ARIndia@123</small></p>
 </section>
 </div>`;
}
function registerPage(){
 el("app").innerHTML=`
 <section class="card"><h2>Student Registration</h2>
 <label>Name</label><input id="rn">
 <label>Student ID</label><input id="ri">
 <label>Password</label><input id="rp" type="password">
 <button onclick="register()">Create Account</button>
 <button class="secondary" onclick="home()">Back</button></section>`;
}
function register(){
 let name=el("rn").value.trim(),id=el("ri").value.trim(),pass=el("rp").value;
 if(!name||!id||pass.length<4)return alert("Enter all details. Password needs 4 characters.");
 if(id.toLowerCase()==="examiner"||data.students.some(s=>s.id.toLowerCase()===id.toLowerCase()))return alert("Student ID already exists.");
 data.students.push({name,id,pass});
 save();alert("Account created! Please log in.");home();
}
function studentLogin(){
 let id=el("sid").value.trim(),pass=el("sp").value;
 let s=data.students.find(s=>s.id.toLowerCase()===id.toLowerCase()&&s.pass===pass);
 if(!s)return alert("Incorrect student ID or password.");
 user={role:"student",id:s.id,name:s.name};studentPage();
}
function examinerLogin(){
 if(el("eid").value!=="examiner"||el("ep").value!=="ARIndia@123")return alert("Incorrect examiner login.");
 user={role:"examiner"};examinerPage();
}
function logout(){home()}
function studentPage(){
 let exams=data.exams.filter(e=>e.published&&(!e.assigned||e.assigned===user.id));
 let results=data.results.filter(r=>r.studentId===user.id);
 el("app").innerHTML=`
 <section class="card"><h2>Welcome, ${user.name}!</h2>
 <button onclick="logout()">Logout</button></section>
 <section class="card"><h2>Available Tests</h2>
 ${exams.map(e=>`<div class="question"><h3>${e.title}</h3><p>${e.questions.length} questions</p><button onclick="takeTest(${e.id})">Start Test</button></div>`).join("")||"No tests available."}</section>
 <section class="card"><h2>My Results & Progress</h2>
 ${results.map(r=>`<div class="question"><b>${r.title}</b><p>Score: ${r.score}/${r.total} (${r.percent}%)</p></div>`).join("")||"No results yet."}</section>`;
}
function examinerPage(){
 el("app").innerHTML=`
 <section class="card"><h2>Examiner Dashboard</h2>
 <button onclick="examForm()">+ Create Exam</button>
 <button onclick="studentsPage()" class="secondary">Students</button>
 <button onclick="resultsPage()" class="secondary">All Results</button>
 <button onclick="logout()" class="danger">Logout</button></section>
 <section class="card"><h2>Manage Exams</h2>
 ${data.exams.map(e=>`<div class="question"><h3>${e.title}</h3><p>${e.questions.length} questions</p>
 <button onclick="publish(${e.id})">${e.published?"Unpublish":"Publish"}</button>
 <button class="danger" onclick="deleteExam(${e.id})">Delete</button></div>`).join("")||"No exams created."}</section>`;
}
function examForm(){
 el("app").innerHTML=`
 <section class="card"><h2>Create Exam Paper</h2>
 <label>Exam title</label><input id="title" placeholder="English Grammar Test">
 <label>Assign to student ID (leave empty for everyone)</label><input id="assigned">
 <label>Question type</label>
 <select id="type" onchange="questionFields()">
 <option value="mcq">Multiple Choice</option>
 <option value="fill">Fill in the Blanks</option>
 <option value="truefalse">True / False</option>
 </select>
 <label>Question</label><textarea id="question"></textarea>
 <div id="fields">
 <label>Options (separate with | )</label><input id="options" placeholder="Option A|Option B|Option C">
 </div>
 <label>Correct answer (MCQ: option number starting from 1)</label><input id="answer">
 <label>Marks</label><input id="marks" type="number" value="1" min="1">
 <button onclick="addQuestion()">Add Question</button>
 <div id="questionList"></div>
 <button onclick="saveExam()">Save Exam</button>
 <button class="secondary" onclick="examinerPage()">Cancel</button></section>`;
 window.newQuestions=[];
}
function questionFields(){
 let t=el("type").value;
 el("fields").innerHTML=t==="mcq"?`<label>Options (separate with | )</label><input id="options" placeholder="Option A|Option B|Option C">`:"";
 el("answer").placeholder=t==="mcq"?"Correct option number":"Correct answer";
}
function addQuestion(){
 let type=el("type").value,text=el("question").value.trim(),answer=el("answer").value.trim(),marks=Number(el("marks").value);
 if(!text||!answer||marks<1)return alert("Complete the question, answer and marks.");
 let options=type==="mcq"?el("options").value.split("|").map(x=>x.trim()).filter(Boolean):[];
 if(type==="mcq"&&(!options.length||Number(answer)<1||Number(answer)>options.length))return alert("Enter options and a valid correct option number.");
 if(type==="truefalse"&&!["true","false"].includes(answer.toLowerCase()))return alert("Answer must be True or False.");
 window.newQuestions.push({type,text,answer,options,marks});
 el("questionList").innerHTML=window.newQuestions.map((q,i)=>`<div class="question">${i+1}. ${q.text} (${q.marks} marks)</div>`).join("");
 el("question").value="";el("answer").value="";
 if(el("options"))el("options").value="";
}
function saveExam(){
 let title=el("title").value.trim();
 if(!title||!window.newQuestions.length)return alert("Enter a title and add at least one question.");
 data.exams.push({id:Date.now(),title,assigned:el("assigned").value.trim(),questions:window.newQuestions,published:false});
 save();alert("Exam saved as draft.");examinerPage();
}
function publish(id){
 let e=data.exams.find(e=>e.id===id);e.published=!e.published;save();examinerPage();
}
function deleteExam(id){
 if(!confirm("Delete this exam and its results?"))return;
 data.exams=data.exams.filter(e=>e.id!==id);
 save();examinerPage();
}
function takeTest(id){
 let e=data.exams.find(e=>e.id===id);
 let old=data.results.find(r=>r.examId===id&&r.studentId===user.id);
 if(old)return alert("You have already submitted this test.");
 el("app").innerHTML=`<section class="card"><h2>${e.title}</h2>
 <form id="testForm">${e.questions.map((q,i)=>`<div class="question"><h3>${i+1}. ${q.text} (${q.marks} marks)</h3>
 ${q.type==="mcq"?q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j+1}"> ${o}</label><br>`).join(""):
 q.type==="truefalse"?`<label><input type="radio" name="q${i}" value="True"> True</label><br><label><input type="radio" name="q${i}" value="False"> False</label>`:
 `<input name="q${i}" placeholder="Your answer">`}</div>`).join("")}
 <button type="button" onclick="submitTest(${id})">Submit Test</button></form></section>`;
}
function submitTest(id){
 let e=data.exams.find(e=>e.id===id),form=new FormData(el("testForm")),score=0,total=0;
 e.questions.forEach((q,i)=>{
 let a=String(form.get("q"+i)||"").trim(),correct=String(q.answer).trim();
 let ok=q.type==="mcq"?Number(a)===Number(correct):a.toLowerCase()===correct.toLowerCase();
 if(ok)score+=q.marks;total+=q.marks;
 });
 let result={examId:id,title:e.title,studentId:user.id,score,total,percent:Math.round(score/total*100),date:new Date().toISOString()};
 data.results.push(result);save();alert("Test submitted! Score: "+score+"/"+total);studentPage();
}
function studentsPage(){
 el("app").innerHTML=`<section class="card"><h2>Registered Students</h2><button onclick="examinerPage()">Back</button>${data.students.map(s=>`<div class="question">${s.name} — ${s.id}</div>`).join("")||"No students yet."}</section>`;
}
function resultsPage(){
 el("app").innerHTML=`<section class="card"><h2>All Results</h2><button onclick="examinerPage()">Back</button>${data.results.map(r=>`<div class="question">${r.studentId} — ${r.title}: ${r.score}/${r.total} (${r.percent}%)</div>`).join("")||"No results yet."}</section>`;
}
document.getElementById("year").textContent=new Date().getFullYear();
home();
</script>
</body>
</html>
